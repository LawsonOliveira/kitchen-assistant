# cost_expert — Hermes config seeded into HERMES_HOME on every start (agents/entrypoint.sh).
_config_version: 42  # schema version of the pinned Hermes image; avoids the legacy-config migration path
model:
  default: claude-sonnet-5  # was Haiku: looped and invented values (PLAN.md correction C15)
  provider: anthropic  # authenticated with CLAUDE_CODE_OAUTH_TOKEN (PLAN.md D46)
terminal:
  cwd: /workspace
plugins:
  enabled:
    - kitchen_a2a
    - kitchen_observability
    - kitchen_guardrails
agent:
  disabled_toolsets: [terminal, file, code_execution, browser, computer_use, image_gen, tts, video, video_gen, vision, cronjob, kanban, spotify, homeassistant, x_search, web, clarify, memory, delegation, session_search, todo]
tools:
  tool_search:
    enabled: "off"  # tools are called directly, no tool_search/tool_call bridge (PLAN.md correction C8)
auxiliary:
  background_review:
    enabled: false  # no self-created skills: skills are versioned in the repo (correction C9)
curator:
  enabled: false
skills:
  write_approval: true
mcp_servers:
  costs:
    url: http://costs-mcp:8000/mcp
    headers:
      Authorization: "Bearer ${COSTS_MCP_TOKEN}"
    tools:
      resources: false  # no generated read_resource/list_resources utilities (correction C22)
      prompts: false  # no generated get_prompt/list_prompts utilities
      include:  # TOOL_PERMISSIONS for cost_expert (writes only with the owner's click or statement, Loop 3)
        - get_pantry
        - get_state_summary
        - check_pantry_match
        - get_launch_menu
        - compute_dish_cost
        - check_budget_fit
        - simulate_promotion
        - record_price_quote
        - set_dish_packaging
        - register_purchase
        - adjust_budget
        - correct_price
        - set_conversion_factor
        - select_price_scenario
        - import_pantry
memory:
  memory_enabled: false
  user_profile_enabled: false
