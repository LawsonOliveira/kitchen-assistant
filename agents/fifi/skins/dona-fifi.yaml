# Dona Fifi skin for the classic CLI (PLAN.md D42, Loop 7). Copied into $HERMES_HOME/skins by the entrypoint and
# selected with display.skin in fifi's config.yaml. Missing keys inherit Hermes' default skin.
name: dona-fifi
description: Dona Fifi — a vovó ajudante da cozinha, tons de tomate, laranja e mostarda

