# researcher — Hermes config seeded into HERMES_HOME on every start (agents/entrypoint.sh).
_config_version: 42  # schema version of the pinned Hermes image; avoids the legacy-config migration path
model:
  default: claude-haiku-4-5-20251001
  provider: anthropic  # authenticated with CLAUDE_CODE_OAUTH_TOKEN (PLAN.md D46)
terminal:
  cwd: /workspace
plugins:
  enabled:
    - sabor_a2a
    - sabor_observability
    - sabor_guardrails
agent:
  disabled_toolsets: [terminal, file, code_execution, browser, computer_use, image_gen, tts, video, video_gen, vision, cronjob, kanban, spotify, homeassistant, x_search, clarify, delegation, skills, session_search, memory]  # research runs only through fan_out_research (C17)
tools:
  tool_search:
    enabled: "off"  # tools are called directly, no tool_search/tool_call bridge (PLAN.md correction C8)
auxiliary:
  background_review:
    enabled: false  # no self-created skills: skills are versioned in the repo (correction C9)
curator:
  enabled: false
skills:
  write_approval: true
web:
  backend: tavily
memory:
  memory_enabled: false
  user_profile_enabled: false
