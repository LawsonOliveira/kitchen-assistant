# recipe_expert — Hermes config seeded into HERMES_HOME on every start (agents/entrypoint.sh).
_config_version: 42  # schema version of the pinned Hermes image; avoids the legacy-config migration path
model:
  default: claude-sonnet-5
  provider: anthropic  # authenticated with CLAUDE_CODE_OAUTH_TOKEN (PLAN.md D46)
terminal:
  cwd: /workspace
plugins:
  enabled:
    - kitchen_a2a
    - kitchen_observability
    - kitchen_guardrails
agent:
  disabled_toolsets: [terminal, file, code_execution, browser, computer_use, image_gen, tts, video, video_gen, vision, cronjob, kanban, spotify, homeassistant, x_search, web, clarify, memory, delegation, session_search, todo]
tools:
  tool_search:
    enabled: "off"  # tools are called directly, no tool_search/tool_call bridge (PLAN.md correction C8)
auxiliary:
  background_review:
    enabled: false  # no self-created skills: skills are versioned in the repo (correction C9)
curator:
  enabled: false
skills:
  write_approval: true
mcp_servers:
  ledger:
    url: http://kitchen-ledger:8000/mcp
    supports_parallel_tool_calls: true  # its reads are independent (PLAN.md C77, latency pass)
    headers:
      Authorization: "Bearer ${LEDGER_TOKEN}"
    tools:
      resources: false  # no generated read_resource/list_resources utilities (correction C22)
      prompts: false  # no generated get_prompt/list_prompts utilities
      include:
        - get_pantry
        - get_state_summary
        - check_pantry_match
        - get_launch_menu
        - check_viability
        - register_candidate_dish
        - reject_candidate_dish
        - set_launch_batch_portions
        - record_measure_quote
        - confirm_measure
        - find_cached_recipes
        - cache_recipes
        - confirm_dish_requirement
        - accept_dish
        - update_kitchen_profile
memory:
  memory_enabled: false
  user_profile_enabled: false
