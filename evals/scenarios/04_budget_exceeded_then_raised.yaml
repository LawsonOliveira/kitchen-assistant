# Format: see 01_happy_path.yaml.
id: "04_budget_exceeded_then_raised"
title: "The purchases exceed the budget, alternatives are offered, the owner raises the budget with a click"
owner_profile:
  name: "Dona Maria"
  persona: "Opening her first delivery restaurant on iFood; believes in her shrimp dish and has some savings."
  goal: "Launch her shrimp in coconut sauce even if it costs more than the R$ 80,00 left."
  behavior:
    - "She dictates her recipe in the opening message."
    - "When Dona Sálvia shows estimated prices, she corrects them with her own prices."
    - "When told the purchases do not fit the budget, she listens to the alternatives and then decides to raise the budget by exactly the shortfall (never more than R$ 100,00)."
    - "She confirms the purchases and the acceptance of the dish."
  opening_message: >
    Dona Sálvia, meu prato de lançamento vai ser camarão ao molho de coco: rende 4 porções, 60 minutos, 1 kg de camarão,
    200 ml de leite de coco, 100 g de cebola, 200 g de tomate, 20 ml de azeite de oliva e 1 pitada de sal.
    Quero fazer 8 porções no lançamento.
facts_to_reveal_only_if_asked:
  - topic: "price of shrimp"
    answer: "Pago R$ 60,00 no quilo do camarão limpo."
  - topic: "price of coconut milk"
    answer: "O vidrinho de 200 ml de leite de coco sai R$ 5,00."
  - topic: "stove burners"
    answer: "Fogão de 4 bocas."
  - topic: "time per batch"
    answer: "Umas 3 horas por leva."
  - topic: "fridge space"
    answer: "Uns 100 litros livres na geladeira."
  - topic: "gas or energy"
    answer: "Gás de botijão."
  - topic: "raise the budget"
    answer: "Pode aumentar o orçamento só no valor que faltar, eu tiro da minha reserva."
clarify_answers:
  - question_contains: ["preço"]
    choices_count: 3  # the three price scenarios, not a Confirmar/Cancelar price confirmation
    choice_by_price: cheapest
  - default: "Confirmar"
expected_state:
  - check: "the budget overrun was detected before buying"
    sql: "SELECT count(*) >= 1 FROM audit_log WHERE (tool = 'register_purchase' AND error_code = 'budget_exceeded') OR (tool = 'check_budget_fit' AND result->>'fits' = 'false')"
  - check: "exactly one explicit raise, positive and at most R$ 100,00"
    sql: "SELECT count(*) = 1 AND sum(delta) > 0 AND sum(delta) <= 100.00 FROM budget_adjustments"
  - check: "the budget is not negative"
    sql: "SELECT remaining >= 0 FROM budget_status"
  - check: "the shrimp was bought for the dish"
    sql: "SELECT count(*) >= 1 FROM purchases p JOIN ingredients i ON i.id = p.ingredient_id WHERE i.name ILIKE 'camar%' AND p.dish_id IS NOT NULL"
trajectory_rules:
  - id: "raise_before_the_shrimp_purchase"
    type: precedes
    first: {tool: adjust_budget}
    then: [{tool: register_purchase}]
    require_then: true
  - id: "clicks_before_money_and_decisions"
    type: click_before
    tools: [adjust_budget, register_purchase, accept_dish, select_price_scenario]
rubric_focus: [owner_decides, clarity_of_numbers]
