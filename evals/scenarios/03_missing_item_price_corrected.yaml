# Format: see 01_happy_path.yaml.
id: "03_missing_item_price_corrected"
title: "A missing item gets a web estimate, the owner corrects it, CMV uses her price"
owner_profile:
  name: "Dona Maria"
  persona: "Opening her first delivery restaurant on iFood; knows exactly what she pays at the market next door."
  goal: "Price her own chicken stroganoff recipe."
  behavior:
    - "She dictates her recipe in the opening message."
    - "When Dona Sálvia shows an estimated internet price for creme de leite, she corrects it with the price she pays."
    - "She does not want to buy anything in this conversation; she only wants to know the cost."
  opening_message: >
    Dona Sálvia, quero saber o custo do meu strogonoff de frango: rende 4 porções, leva 40 minutos e usa 600 g de
    peito de frango, 200 g de creme de leite, 100 g de cebola, 200 g de tomate, 20 ml de óleo de soja e 1 pitada de sal.
facts_to_reveal_only_if_asked:
  - topic: "price of creme de leite"
    answer: "Eu compro a caixinha de 200 g de creme de leite por R$ 3,49 no mercado aqui do lado."
  - topic: "stove burners"
    answer: "Tenho fogão de 4 bocas."
  - topic: "time per batch"
    answer: "Consigo cozinhar umas 3 horas por leva."
  - topic: "fridge space"
    answer: "Tenho uns 100 litros livres na geladeira."
  - topic: "gas or energy"
    answer: "Gás de botijão."
  - topic: "launch batch size"
    answer: "4 porções no lançamento."
clarify_answers:
  - question_contains: ["compra"]
    choice: "Cancelar"
  - default: "Confirmar"
expected_state:
  - check: "the web estimate for creme de leite was stored first"
    sql: "SELECT count(*) >= 1 FROM ingredient_prices p JOIN ingredients i ON i.id = p.ingredient_id WHERE i.name ILIKE 'creme de leite%' AND p.source = 'web_estimate'"
  - check: "her price is the current price, as owner_confirmed"
    sql: "SELECT count(*) = 1 FROM current_ingredient_prices p JOIN ingredients i ON i.id = p.ingredient_id WHERE i.name ILIKE 'creme de leite%' AND p.source = 'owner_confirmed' AND p.total_price_paid = 3.49 AND p.quantity_purchased_base = 200"
  - check: "nothing was bought"
    sql: "SELECT count(*) = 0 FROM purchases"
trajectory_rules:
  - id: "estimate_before_correction"
    type: precedes
    first: {tool: record_price_quote, args: {source: web_estimate}}
    then: [{tool: correct_price}, {tool: record_price_quote, args: {source: owner_confirmed}}]
    require_then: true
  - id: "cmv_uses_her_price"
    type: precedes
    first: {tool: correct_price}
    then: [{tool: compute_dish_cost, result_text_contains: "R$ 3,49"}]
    require_then: true
rubric_focus: [clarity_of_numbers, owner_decides]
